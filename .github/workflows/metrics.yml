name: Metrics

on:
  schedule:
    - cron: "0 0 * * *" # Chạy tự động vào 00:00 UTC mỗi ngày
  workflow_dispatch: # Cho phép kích hoạt chạy thủ công từ tab Actions
  push:
    branches: ["main", "master"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Main GitHub Stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: toan215
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Ho_Chi_Minh
          filename: github-metrics.svg

      - name: Most Used Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: toan215
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          config_timezone: Asia/Ho_Chi_Minh
          filename: github-metrics-languages.svg
